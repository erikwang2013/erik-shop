name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['8.3', '8.4']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: erik_shop_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, redis, mbstring
          coverage: none

      - name: Install dependencies
        working-directory: service
        run: composer install --no-progress --prefer-dist

      - name: Install admin dependencies
        working-directory: admin
        run: composer install --no-progress --prefer-dist

      - name: Dependency security audit
        working-directory: service
        run: composer audit --no-interaction || echo "Known low-severity CVE tracked - CVE-2025-45769 (firebase/php-jwt <7.0.0, constrained by jwt-webman ^6.0)"

      - name: PHPStan static analysis
        working-directory: service
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Controller smoke check (admin)
        run: php scripts/smoke_controllers.php

      - name: Admin PHPStan static analysis
        working-directory: admin
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Admin PHPUnit tests
        working-directory: admin
        run: php vendor/bin/phpunit

      - name: PHP syntax check
        run: |
          find service/app service/config admin/app admin/config -name "*.php" -exec php -l {} \; | grep -v "No syntax" && exit 1 || exit 0

      - name: Run tests
        working-directory: service
        run: php vendor/bin/phpunit
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: erik_shop_test
          DB_USER: root
          DB_PASS: testpass
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-secret-key-do-not-use-in-production

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # 注：GitHub 托管 runner 无 HarmonyOS 工具链（ohpm/hvigor/DevEco SDK），
  # 本 job 为官方 action 骨架，需在自备工具链的 runner（如自托管 + DevEco
  # Studio command-line-tools）上启用；hvigor 任务名以实际 DevEco 工程为准。
  harmonyos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ohpm
        uses: huawei/ohpm-action@v1

      - name: Install dependencies
        working-directory: apps/harmonyos
        run: ohpm install --all

      - name: Build HAP
        uses: huawei/hvigor-action@v1
        with:
          working-directory: apps/harmonyos
          task: assembleHap
