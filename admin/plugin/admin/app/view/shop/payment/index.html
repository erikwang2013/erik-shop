<!DOCTYPE html>
<html lang="zh-cn">
    <head>
        <meta charset="utf-8">
        <title>支付记录</title>
        <link rel="stylesheet" href="/app/admin/component/pear/css/pear.css" />
        <link rel="stylesheet" href="/app/admin/admin/css/reset.css" />
    </head>
    <body class="pear-container">

        <!-- 顶部查询表单 -->
        <div class="layui-card">
            <div class="layui-card-body">
                <form class="layui-form top-search-from">

                    <div class="layui-form-item">
                        <label class="layui-form-label">交易号</label>
                        <div class="layui-input-block">
                            <input type="text" name="transaction_no" value="" class="layui-input">
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">订单ID</label>
                        <div class="layui-input-block">
                            <input type="number" name="order_id" value="" class="layui-input">
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">用户ID</label>
                        <div class="layui-input-block">
                            <input type="number" name="user_id" value="" class="layui-input">
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">支付网关</label>
                        <div class="layui-input-block">
                            <input type="text" name="gateway" value="" class="layui-input">
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">状态</label>
                        <div class="layui-input-block">
                            <select name="status">
                                <option value="">全部</option>
                                <option value="0">待支付</option>
                                <option value="1">已支付</option>
                                <option value="2">已退款</option>
                                <option value="3">失败</option>
                            </select>
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">币种</label>
                        <div class="layui-input-block">
                            <input type="text" name="currency_code" value="" class="layui-input">
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">支付时间</label>
                        <div class="layui-input-block" id="paid_at">
                            <input type="text" autocomplete="off" name="paid_at[]" id="paid_at-date-start" class="layui-input inline-block" placeholder="开始时间">
                            -
                            <input type="text" autocomplete="off" name="paid_at[]" id="paid_at-date-end" class="layui-input inline-block" placeholder="结束时间">
                        </div>
                    </div>

                    <div class="layui-form-item layui-inline">
                        <label class="layui-form-label"></label>
                        <button class="pear-btn pear-btn-md pear-btn-primary" lay-submit lay-filter="table-query">
                            <i class="layui-icon layui-icon-search"></i>查询
                        </button>
                        <button type="reset" class="pear-btn pear-btn-md" lay-submit lay-filter="table-reset">
                            <i class="layui-icon layui-icon-refresh"></i>重置
                        </button>
                    </div>
                    <div class="toggle-btn">
                        <a class="layui-hide">展开<i class="layui-icon layui-icon-down"></i></a>
                        <a class="layui-hide">收起<i class="layui-icon layui-icon-up"></i></a>
                    </div>
                </form>
            </div>
        </div>

        <!-- 数据表格 -->
        <div class="layui-card">
            <div class="layui-card-body">
                <table id="data-table" lay-filter="data-table"></table>
            </div>
        </div>

        <script src="/app/admin/component/layui/layui.js?v=2.8.12"></script>
        <script src="/app/admin/component/pear/pear.js"></script>
        <script src="/app/admin/admin/js/permission.js"></script>
        <script src="/app/admin/admin/js/common.js"></script>
        <script>

            // 相关常量
            const PRIMARY_KEY = "id";
            const SELECT_API = "/app/admin/shop/ShopPayment/select";

            // 字段 支付时间 paid_at
            layui.use(["laydate"], function() {
                layui.laydate.render({
                    elem: "#paid_at",
                    range: ["#paid_at-date-start", "#paid_at-date-end"],
                    type: "datetime",
                });
            })

            // 表格渲染
            layui.use(["table", "form", "common", "popup", "util"], function() {
                let table = layui.table;
                let form = layui.form;
                let $ = layui.$;
                let common = layui.common;
                let util = layui.util;

                // 表头参数
                let cols = [
                    {
                        type: "checkbox"
                    },{
                        title: "交易号",
                        field: "transaction_no",
                        sort: true,
                    },{
                        title: "订单ID",
                        field: "order_id",
                    },{
                        title: "用户ID",
                        field: "user_id",
                    },{
                        title: "网关",
                        field: "gateway",
                    },{
                        title: "支付方式",
                        field: "method",
                    },{
                        title: "金额",
                        field: "amount",
                        sort: true,
                    },{
                        title: "币种",
                        field: "currency_code",
                    },{
                        title: "状态",
                        field: "status",
                        templet: function (d) {
                            let text = ["待支付", "已支付", "已退款", "失败"][d["status"]] ?? "未知";
                            return util.escape(text);
                        }
                    },{
                        title: "3DS状态",
                        field: "three_ds_status",
                        hide: true,
                    },{
                        title: "已退款金额",
                        field: "refunded_amount",
                    },{
                        title: "支付时间",
                        field: "paid_at",
                    },{
                        title: "来源平台",
                        field: "platform",
                        hide: true,
                    },{
                        title: "创建时间",
                        field: "created_at",
                        sort: true,
                    }
                ];

                // 渲染表格
                function render()
                {
                    table.render({
                        elem: "#data-table",
                        url: SELECT_API,
                        page: true,
                        cols: [cols],
                        skin: "line",
                        size: "lg",
                        autoSort: false,
                        defaultToolbar: [{
                            title: "刷新",
                            layEvent: "refresh",
                            icon: "layui-icon-refresh",
                        }, "filter", "print", "exports"],
                    });
                }

                render();

                // 刷新按钮
                table.on("toolbar(data-table)", function (obj) {
                    if (obj.event === "refresh") {
                        common.refresh();
                    }
                });
            });
        </script>
    </body>
</html>
