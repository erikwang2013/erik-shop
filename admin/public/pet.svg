<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
     role="img" aria-labelledby="petTitle petDesc">
  <title id="petTitle">雪球 Snowy — Erik Shop 项目宠物</title>
  <desc id="petDesc">头顶雪花冠、身披经纬线的地球精灵，怀抱一只跨境包裹。</desc>

  <defs>
    <linearGradient id="globe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FC0FF"/>
      <stop offset=".55" stop-color="#2d8cf0"/>
      <stop offset="1" stop-color="#1866C9"/>
    </linearGradient>
    <linearGradient id="cardboard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3C68C"/>
      <stop offset="1" stop-color="#D79A54"/>
    </linearGradient>
    <clipPath id="globeClip">
      <circle cx="128" cy="150" r="72"/>
    </clipPath>
    <style>
      .bob  { animation: bob 3.2s ease-in-out infinite; transform-origin: 128px 214px; }
      .eye  { animation: blink 4.6s ease-in-out infinite;
              transform-box: fill-box; transform-origin: center; }
      .snow { animation: spin 26s linear infinite; transform-origin: 128px 50px; }
      @keyframes bob   { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
      @keyframes blink { 0%,92%,100% { transform: scaleY(1) } 95% { transform: scaleY(.1) } }
      @keyframes spin  { to { transform: rotate(360deg) } }
      /* 尊重系统「减少动态效果」设置 */
      @media (prefers-reduced-motion: reduce) {
        .bob, .eye, .snow { animation: none }
      }
    </style>
  </defs>

  <g class="bob">
    <!-- 雪花冠：呼应 Snowflake 分布式 ID -->
    <g class="snow" fill="none" stroke="#5CB3FF" stroke-width="5" stroke-linecap="round">
      <g transform="translate(128 50)">
        <g id="snowArm">
          <path d="M0 0 V-26"/>
          <path d="M-7 -21 L0 -14 L7 -21"/>
          <path d="M-5 -31 L0 -26 L5 -31"/>
        </g>
        <use href="#snowArm" transform="rotate(60)"/>
        <use href="#snowArm" transform="rotate(120)"/>
        <use href="#snowArm" transform="rotate(180)"/>
        <use href="#snowArm" transform="rotate(240)"/>
        <use href="#snowArm" transform="rotate(300)"/>
      </g>
    </g>

    <!-- 地球身体：呼应跨境电商 -->
    <circle cx="128" cy="150" r="72" fill="url(#globe)"/>
    <g clip-path="url(#globeClip)" fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="3">
      <ellipse cx="128" cy="150" rx="72" ry="26"/>
      <ellipse cx="128" cy="106" rx="62" ry="18"/>
      <ellipse cx="128" cy="194" rx="62" ry="18"/>
      <ellipse cx="128" cy="150" rx="30" ry="72"/>
      <ellipse cx="128" cy="150" rx="60" ry="72"/>
    </g>
    <ellipse cx="100" cy="112" rx="34" ry="23" fill="#ffffff" fill-opacity=".2"
             transform="rotate(-26 100 112)"/>

    <!-- 表情 -->
    <g fill="#0B2E52">
      <ellipse class="eye" cx="107" cy="140" rx="8.5" ry="8.5"/>
      <ellipse class="eye" cx="149" cy="140" rx="8.5" ry="8.5"/>
    </g>
    <circle cx="110" cy="137" r="3" fill="#ffffff"/>
    <circle cx="152" cy="137" r="3" fill="#ffffff"/>
    <ellipse cx="84" cy="160" rx="10" ry="6" fill="#FF9DB0" fill-opacity=".45"/>
    <ellipse cx="172" cy="160" rx="10" ry="6" fill="#FF9DB0" fill-opacity=".45"/>
    <path d="M119 163 Q128 172 137 163" fill="none" stroke="#0B2E52"
          stroke-width="4" stroke-linecap="round"/>

    <!-- 手臂（画在包裹之下，形成环抱感） -->
    <g fill="none" stroke="#1E6FD0" stroke-width="15" stroke-linecap="round">
      <path d="M64 172 Q76 200 102 204"/>
      <path d="M192 172 Q180 200 154 204"/>
    </g>

    <!-- 跨境包裹：呼应国际物流 -->
    <rect x="96" y="188" width="64" height="52" rx="7" fill="url(#cardboard)"/>
    <rect x="121" y="188" width="14" height="52" fill="#FFE0B0" fill-opacity=".75"/>
    <rect x="102" y="202" width="16" height="13" rx="3" fill="#FFF8EC" fill-opacity=".85"/>
  </g>
</svg>
