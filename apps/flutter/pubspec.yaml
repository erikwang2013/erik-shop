name: shop_app
description: Erik Cross-Border E-Commerce Client
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.18.0
  flutter_riverpod: ^2.3.0
  go_router: ^12.0.0
  dio: ^5.3.0
  responsive_framework: ^1.1.0
  cached_network_image: ^3.3.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0
  fl_chart: ^0.63.0
  window_manager: ^0.3.0
  google_sign_in: ^6.1.0
  sign_in_with_apple: ^5.0.0
  flutter_facebook_auth: ^6.0.0
  shimmer: ^3.0.0
  currency_formatter: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
