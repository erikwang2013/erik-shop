# 跨境电商平台 - Docker 生产部署配置
# =============================================================
# 生产部署前必须通过 .env（同目录）或环境变量设置以下密钥：
#   JWT_SECRET / JWT_SECRET_KEY   — 随机 256bit（如 openssl rand -base64 48）
#   ENCRYPTION_KEY                — base64: 前缀的 16/24/32 字节密钥
#   HASHIDS_SALT / DB_PASS / MYSQL_ROOT_PASS / REDIS_PASS
# 默认占位符仅用于本地开发，切勿用于生产。

version: '3.8'

services:
  # ===== Nginx 反向代理 =====
  nginx:
    image: nginx:alpine
    container_name: erik-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./service/public:/var/www/static:ro
    depends_on:
      - service
      - admin
    networks:
      - erik-net

  # ===== Service API =====
  service:
    build:
      context: ./service
      dockerfile: Dockerfile
    container_name: erik-service
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=erik_shop
      - DB_USER=erik
      - DB_PASS=${DB_PASS:-change_me}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - JWT_SECRET=${JWT_SECRET:-change_me_to_random_256bit_string}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change_me_to_random_256bit_string}
      - HASHIDS_SALT=${HASHIDS_SALT:-change_me}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-base64:Y2hhbmdlX21lXzMyX2J5dGVfa2V5X2hlcmVfMDEyMzQ=}
      - ENCRYPTION_CIPHER=${ENCRYPTION_CIPHER:-AES-256-CBC}
      - ENCRYPTION_PREVIOUS_KEYS=${ENCRYPTION_PREVIOUS_KEYS:-}
    volumes:
      - ./service:/app
      - /app/runtime
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - erik-net

  # ===== Admin 管理后台 =====
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: erik-admin
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=erik_shop
      - DB_USER=erik
      - DB_PASS=${DB_PASS:-change_me}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - HASHIDS_SALT=${HASHIDS_SALT:-change_me}
      - SNOWFLAKE_WORKER_ID=${SNOWFLAKE_WORKER_ID:-2}
      - SNOWFLAKE_DATACENTER_ID=${SNOWFLAKE_DATACENTER_ID:-1}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-base64:Y2hhbmdlX21lXzMyX2J5dGVfa2V5X2hlcmVfMDEyMzQ=}
      - ENCRYPTION_CIPHER=${ENCRYPTION_CIPHER:-AES-256-CBC}
      - ENCRYPTION_PREVIOUS_KEYS=${ENCRYPTION_PREVIOUS_KEYS:-}
    volumes:
      - ./admin:/app
      - /app/runtime
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8788/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - erik-net

  # ===== MySQL 8.0 =====
  mysql:
    image: mysql:8.0
    container_name: erik-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASS:-change_me}
      MYSQL_DATABASE: erik_shop
      MYSQL_USER: erik
      MYSQL_PASSWORD: ${DB_PASS:-change_me}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./install.sql:/docker-entrypoint-initdb.d/01-install.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASS:-change_me}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - erik-net

  # ===== Redis 7 =====
  redis:
    image: redis:7-alpine
    container_name: erik-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes --requirepass ${REDIS_PASS:-}
    networks:
      - erik-net

  # ===== Elasticsearch 8 =====
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: erik-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:9200/_cluster/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - erik-net

volumes:
  mysql_data:
  redis_data:
  es_data:

networks:
  erik-net:
    driver: bridge
