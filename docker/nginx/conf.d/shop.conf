# ===== Service API =====
upstream service_api {
    server service:8787;
    keepalive 64;
}

# ===== Admin =====
upstream admin_web {
    server admin:8788;
    keepalive 64;
}

server {
    listen 80;
    server_name api.erik.xyz;

    # API 反向代理
    location / {
        proxy_pass http://service_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name admin.erik.xyz;

    # 上传文件（文件名唯一 → immutable 缓存正确；删除靠 CDN purge 即时失效 + 7 天自然过期兜底）
    location /app/admin/upload/ {
        proxy_pass http://admin_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # 管理后台
    location / {
        proxy_pass http://admin_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
